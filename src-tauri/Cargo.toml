[package]
name = "geoframe-raw-assist"
version = "0.1.0"
description = "GeoFrame RAW Assist desktop shell"
authors = ["GeoFrame RAW Assist"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4.4"
# Core Image 試験現像（src/coreimage.rs）: capture_id の検証とキャッシュ名の安定ハッシュ。
regex = "1"
sha2 = "0.10"
