[package]
name = "geoframe-raw-assist"
version = "0.1.0"
description = "GeoFrame RAW Assist desktop shell"
authors = ["GeoFrame RAW Assist"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Core Image 試験現像（src/coreimage.rs）: capture_id の検証とキャッシュ名の安定ハッシュ。
regex = "1"
sha2 = "0.10"
# root_key_for（Python local_raw/config.py と同じ sha1 先頭 8 桁）。
sha1 = "0.10"
# 解析 lite（src/analysis.rs。Issue #110）: EXIF 読み取り・1/8 スケール JPEG デコード・サムネイル。
kamadak-exif = "0.6"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
