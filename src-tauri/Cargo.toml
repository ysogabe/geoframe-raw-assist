[package]
name = "geoframe-raw-assist"
version = "0.1.0"
description = "GeoFrame RAW Assist: macOS app that assists culling and RAW development of travel photos"
authors = ["Yoshio Sogabe"]
license = "MIT"
repository = "https://github.com/ysogabe/geoframe-raw-assist"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# #141 B1 PR-B: QA 専用。preview だけ常駐 stateless CLI（resident）で実行し、tauri/devtools も有効にする。
# 製品ビルドでは使わない。専用 QA ID（com.geoframe.rawassist.qaroadmap）以外の起動は main が Builder::build の前に拒否する（exit 1、ウィンドウは作らない。setup でも同じ検査を重ねる）。
resident-preview-qa = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Core Image 試験現像（src/coreimage.rs）: capture_id の検証とキャッシュ名の安定ハッシュ。
regex = "1"
sha2 = "0.10"
# root_key_for（Python local_raw/config.py と同じ sha1 先頭 8 桁）。
sha1 = "0.10"
# 解析 lite（src/analysis.rs。Issue #110）: EXIF 読み取り・1/8 スケール JPEG デコード・サムネイル。
kamadak-exif = "0.6"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
